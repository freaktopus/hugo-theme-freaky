baseURL = "https://example.com/"
title = "Freaky Theme Example"
theme = "hugo-theme-freaky"

[params]
  handle = "your-handle"
  name = "Your Name"
  aka = "Freaky Alias"
  bio = "Short one-line description of who you are and what you do."
  location = "City, Country"

  # Hero avatars (place images in your site's static/images/)
  [params.hero]
    avatar1 = "images/coffee_avatar_1.png"
    avatar2 = "images/coffee_avatar_2.png"
    hold_a = 4500
    hold_b = 1500

  # Optional: show a total site-views counter under the org tags.
  # Point count_url at any endpoint returning JSON like {"count": 42}.
  # [params.siteviews]
  #   enabled = true
  #   count_url = "https://your-counter.example.com/count"
  #   label = "Site Views"

  # Optional: override design tokens without editing the theme CSS.
  # [params.style]
  #   accentColor = "#d9554e"

  # Optional: hide the small "freaky theme" credit in the footer.
  # hideThemeCredit = true

  current_roles = [
    "Role One @ Company",
    "Role Two @ Lab / Org",
    "Another thing you do",
  ]

  [[params.orgs]]
    name = "Example Org"
    link = "https://example.com/"

  [[params.orgs]]
    name = "Another Org"
    link = "https://example.org/"

  [params.about]
    lead = "A short tagline about you."
    body = """Replace this with a longer paragraph that describes you, your work, or your interests. Line breaks are supported."""

  [[params.tracks]]
    title = "Record"
    subtitle = "Document the journey along the way."
    link = "https://example.com/record"
    avatar1 = "images/vlog_avatar_1.png"
    avatar2 = "images/vlog_avatar_2.png"
    hold_a = 5800
    hold_b = 3800
    delay = 500

  [[params.tracks]]
    title = "Research"
    subtitle = "Challenge the known. Push the frontier."
    link = "https://example.com/research"
    avatar1 = "images/research_avatar_1.png"
    avatar2 = "images/research_avatar_2.png"
    hold_a = 6500
    hold_b = 4200
    delay = 1100

  [[params.tracks]]
    title = "Engineer"
    subtitle = "Turn ideas into systems that work."
    link = "https://example.com/projects"
    avatar1 = "images/code_avatar_1.png"
    avatar2 = "images/code_avatar_2.png"
    hold_a = 7200
    hold_b = 4800
    delay = 1700

  [[params.contact_purposes]]
    value = "research"
    label = "Research Collaboration"

  [[params.contact_purposes]]
    value = "qa"
    label = "Q/A"

  [[params.contact_purposes]]
    value = "project"
    label = "Project Inquiry"

  [[params.contact_purposes]]
    value = "speaking"
    label = "Talk / Workshop"

  [[params.contact_purposes]]
    value = "other"
    label = "Others"

[params.social]
  github = "https://github.com/your-handle"
  linkedin = "https://linkedin.com/in/your-handle"
  twitter = "https://x.com/your-handle"
  instagram = "https://www.instagram.com/your-handle/"
  facebook = "https://www.facebook.com/your-handle/"

